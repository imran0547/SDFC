<template>
    <div class="slds-box slds-box_x-small">
        <p>{message}</p>
        <template lwc:if={hasDraft}>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{summary}</p>
            <lightning-button class="slds-m-top_small" variant="brand" label="Review and save" onclick={handleOpen}></lightning-button>
        </template>
        <template lwc:if={status}>
            <p class="slds-m-top_small slds-text-color_success">{status}</p>
        </template>
    </div>
</template>
